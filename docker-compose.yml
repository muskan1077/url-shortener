services:
  mysql:
    image: mysql:8.4
    container_name: url-shortener-mysql
    environment:
      MYSQL_DATABASE: url_shortener
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    image: url-shortener:1.0
    container_name: url-shortener-app
    ports:
      - "8081:8081"
    depends_on:
      - mysql

volumes:
  mysql-data: