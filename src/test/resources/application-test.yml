spring:
  datasource:
    url: jdbc:h2:mem:urlshortener;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  short-base-url: http://sho.rt
  cache:
    ttl: 2s
